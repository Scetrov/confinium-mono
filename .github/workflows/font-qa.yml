name: Current family font QA
on: pull_request
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - uses: ./.github/actions/fontspector
      - run: uv sync --locked
      - name: Check proposed binaries
        run: uv run --locked python scripts/font_qa.py
      - name: Rebuild from proposed inputs and check
        run: |
          uv run --locked python scripts/full_grid_family.py
          uv run --locked python scripts/variable_repertoire.py
          uv run --locked python scripts/font_qa.py
