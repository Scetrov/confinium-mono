name: Publish font release
on:
  push:
    tags: ['[0-9]*.[0-9]*.[0-9]*']
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate numeric release tag
        run: '[[ "$GITHUB_REF_NAME" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run --locked python -m unittest discover -s tests -v
      - name: Package and verify webfont
        run: |
          mkdir -p dist/{desktop,web}
          cp 'studies/variable-repertoire/fonts/ConfiniumMono-VariableRepertoire[wght].ttf' dist/desktop/ConfiniumMono-Variable.ttf
          uv pip install 'brotli==1.1.0'
          .venv/bin/fonttools ttLib.woff2 compress dist/desktop/*.ttf -o dist/web/ConfiniumMono-Variable.woff2
          .venv/bin/fonttools ttLib.woff2 decompress dist/web/*.woff2 -o "$RUNNER_TEMP/check.ttf"
          cp README.md OFL.txt dist/
          (cd dist && zip -qr ../ConfiniumMono-Variable.zip .)
          sha256sum ConfiniumMono-Variable.zip > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            ConfiniumMono-Variable.zip
            SHA256SUMS
  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "Confinium Mono $GITHUB_REF_NAME" ConfiniumMono-Variable.zip SHA256SUMS
