name: Publish font release
on:
  push:
    tags: ['[0-9]*.[0-9]*.[0-9]*']
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate numeric release tag
        run: '[[ "$GITHUB_REF_NAME" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run --locked python -m unittest discover -s tests -v
      - uses: ./.github/actions/fontspector
      - name: Package and verify webfont
        run: |
          mkdir -p dist/{desktop,web}
          cp 'studies/variable-repertoire/fonts/ConfiniumMono-VariableRepertoire[wght].ttf' dist/desktop/ConfiniumMono-Variable.ttf
          for cut in Grid Open Dense Hollow; do
            cp "studies/grid-token-bold/full-family/fonts/ConfiniumMono-Full${cut}.ttf" dist/desktop/
          done
          uv run --locked python scripts/font_qa.py --desktop dist/desktop
          uv pip install 'brotli==1.1.0'
          for font in dist/desktop/*.ttf; do
            name=$(basename "$font" .ttf)
            .venv/bin/fonttools ttLib.woff2 compress "$font" -o "dist/web/$name.woff2"
            .venv/bin/fonttools ttLib.woff2 decompress "dist/web/$name.woff2" -o "$RUNNER_TEMP/$name.ttf"
          done
          cp README.md OFL.txt dist/
          (cd dist && zip -qr ../ConfiniumMono-Family.zip .)
          sha256sum ConfiniumMono-Family.zip > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: |
            ConfiniumMono-Family.zip
            SHA256SUMS
  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-assets
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "Confinium Mono $GITHUB_REF_NAME" ConfiniumMono-Family.zip SHA256SUMS
