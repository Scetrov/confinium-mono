@font-face{font-family:'Confinium Mono';src:url('../fonts/ConfiniumMono[wght].ttf?revision=2') format('truetype');font-weight:100 700;font-style:normal;font-display:block}
:root{color:var(--text);background:var(--paper);font:16px/1.55 system-ui,sans-serif}*{box-sizing:border-box}header{border-top:4px solid;padding-top:20px}h1{font-size:clamp(32px,5vw,72px);letter-spacing:-.05em;line-height:1.05;margin:20px 0}h2{font-size:18px}p{max-width:780px}.eyebrow,small{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}.controls{display:flex;gap:24px;flex-wrap:wrap;padding:24px 0}label{display:block}input[type=range]{width:220px;accent-color:var(--accent)}input[type=text]{font:inherit;width:100%;padding:12px;background:transparent;color:inherit;border:1px solid var(--border)}.drawing{font-family:'Confinium Mono';font-synthesis:none;letter-spacing:0;line-height:1.127;white-space:pre;font-kerning:none}.live{overflow:auto;border:1px solid var(--border);padding:24px 12px;background:var(--surface)}.row{padding:24px 0;border-bottom:1px solid var(--border)}.row .drawing{font-size:clamp(40px,8.5vw,130px);padding:22px 0;overflow:auto}.proof{overflow:auto;padding:18px 0}.proof .drawing{margin:14px 0}.review{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:24px;margin:36px 0}.review article{border-top:1px solid;padding-top:12px}a{color:inherit}footer{margin-top:60px;border-top:1px solid;padding-top:20px}.status{color:var(--accent)}
